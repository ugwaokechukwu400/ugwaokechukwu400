<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBite - Create Account</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-light navbar-light border position-sticky top-0 shadow-sm" style="z-index: 1000;">
        <div class="container-fluid">
          <a class="navbar-brand fw-bold fs-3 text-warning" href="./index.html">CampusBite<span class="text-warning">.</span></a>
          <a href="login.html" class="btn btn-outline-dark btn-sm fw-semibold">← Back to Login</a>
        </div>
    </nav>

    <!-- SIGNUP CONTAINER -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                
                <div class="bg-white border rounded-4 p-4 shadow-sm">
                    <div class="text-center mb-4">
                        <div class="fs-1 mb-2">✨</div>
                        <h3 class="fw-bold text-dark">Create an Account</h3>
                        <p class="text-secondary small">Join CampusBite to start ordering delicious meals.</p>
                    </div>

                    <!-- SIGNUP FORM -->
                    <form id="signupForm" onsubmit="handleSignup(event)">
                        <div class="mb-3">
                            <label for="signupName" class="form-label small fw-semibold text-secondary">Full Name</label>
                            <input type="text" class="form-control" id="signupName" placeholder="e.g., Divine Ugwa" required>
                        </div>

                        <div class="mb-3">
                            <label for="signupEmail" class="form-label small fw-semibold text-secondary">Email Address</label>
                            <input type="email" class="form-control" id="signupEmail" placeholder="e.g., student@pauluniv.edu.ng" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="signupPassword" class="form-label small fw-semibold text-secondary">Password</label>
                            <input type="password" class="form-control" id="signupPassword" placeholder="Create a secure password" required>
                        </div>

                        <div class="mb-4">
                            <label for="signupConfirmPassword" class="form-label small fw-semibold text-secondary">Confirm Password</label>
                            <input type="password" class="form-control" id="signupConfirmPassword" placeholder="Re-enter your password" required>
                        </div>

                        <div class="mb-3 d-flex justify-content-center align-items-center gap-2">
                            <input type="checkbox" class="form-check-input mt-0" id="rememberMe" checked>
                            <label class="form-check-label small text-secondary" for="rememberMe">Remember me on this device</label>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 text-dark shadow-sm mb-3">
                            Register Account 🚀
                        </button>
                    </form>

                    <!-- REDIRECT TO LOGIN -->
                    <div class="text-center">
                        <p class="small text-secondary mb-0">
                            Already have an account? 
                            <a href="login.html" class="fw-bold text-warning text-decoration-none">Log in here</a>

                            
                        </p>
                    </div>
                    
                </div>

            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white py-4 text-center mt-5">
        <div class="container">
            <h4 class="fw-bold mb-3">CampusBite.</h4>
            <p class="mb-0">&copy; 2026 CampusBite. All rights reserved.</p>
        </div>
    </footer>

    <!-- EXTERNAL JAVASCRIPT FILE -->
    <script src="signup.js"></script>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
