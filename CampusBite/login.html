<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusBite - Login / Sign Up</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0 rounded-4 p-4">
                    
                    <!-- Header / Logo -->
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-warning">CampusBite 🍔</h3>
                        <p class="text-secondary small" id="formSubtitle">Sign in to complete your food order</p>
                    </div>

                    <form id="authForm">
                        <!-- Full Name (Only shown during Sign Up) -->
                        <div class="mb-3 d-none" id="nameGroup">
                            <label class="form-label small fw-semibold">Full Name</label>
                            <input type="text" class="form-control" id="fullName" placeholder="e.g. Divine Ugwa">
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" class="form-control" id="authEmail" placeholder="student@pauluniversity.edu.ng" required>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" class="form-control" id="authPassword" placeholder="••••••••" required>
                        </div>

                        <!-- Remember Me Checkbox (Centered) -->
                        <div class="mb-3 d-flex justify-content-center align-items-center gap-2">
                            <input type="checkbox" class="form-check-input mt-0" id="rememberMe" checked>
                            <label class="form-check-label small text-secondary" for="rememberMe">Remember me on this device</label>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 text-white" id="submitBtn">Log In</button>
                    </form>

                    <!-- Toggle between Login and Sign Up -->
                    <div class="text-center mt-4">
                        <p class="small text-secondary mb-0" id="toggleText">
                            Don't have an account? 
                            <a href="./signup.html" class="text-warning fw-bold text-decoration-none" onclick="toggleAuthMode(event)">Create New Account</a>
                        </p>
                    </div>

                    

                </div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
